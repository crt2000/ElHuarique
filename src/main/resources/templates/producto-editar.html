<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - El Huarique de Luis</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIk4tVjgtbUvPzBps4vPnpstBPb5VvP4bKpG9V0sK2smk0P2vK4l8zFwG5zN6z5" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link th:href="@{/style.css}" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container" style="max-width: 650px;">
        <div class="card shadow border-0 rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <i class="bi bi-pencil-square text-warning fs-1"></i>
                <h2 class="fw-bold mt-2">Editar Producto</h2>
                <p class="text-muted small">Actualiza todos los campos del plato seleccionado</p>
            </div>

            <form th:action="@{/productos/actualizar/{id}(id=${plato.id})}" th:object="${plato}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre del Plato</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Descripción</label>
                    <textarea class="form-control" rows="2" th:field="*{descripcion}" required></textarea>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Precio (S/)</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{precio}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Etiqueta</label>
                        <input type="text" class="form-control" th:field="*{etiqueta}" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Ruta de Imagen</label>
                    <input type="text" class="form-control" th:field="*{imagenUrl}" required>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/}" class="btn btn-outline-secondary px-4 rounded-pill">
                        <i class="bi bi-arrow-left me-1"></i>Cancelar
                    </a>
                    <button type="submit" class="btn btn-warning text-dark px-5 rounded-pill fw-bold">
                        <i class="bi bi-check-lg me-1"></i>Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
