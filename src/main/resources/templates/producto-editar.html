<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - El Huarique de Luis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/style.css}" href="style.css" rel="stylesheet">
</head>

<body class="py-5 text-white" style="background: #0f0f1d; min-height: 100vh;">

    <div class="container" style="max-width: 650px;">
        <div class="card shadow-lg border border-white border-opacity-10 rounded-4 p-4 p-md-5"
            style="background: #1a1a2e;">
            <div class="text-center mb-4">
                <i class="bi bi-pencil-square text-warning fs-1"></i>
                <h2 class="fw-bold mt-2 text-white">Editar Producto</h2>
                <p class="text-light text-opacity-75 small">Actualiza todos los campos del plato seleccionado</p>
            </div>

            <form th:action="@{/productos/actualizar/{id}(id=${plato.id})}" th:object="${plato}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-white">Nombre del Plato</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" th:field="*{nombre}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-white">Descripción</label>
                    <textarea class="form-control bg-dark text-white border-secondary" rows="2"
                        th:field="*{descripcion}" required></textarea>
                </div>

                <div class="row g-3 mb-2">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-white">Precio (S/)</label>
                        <input type="number" step="0.01" min="0"
                            class="form-control bg-dark text-white border-secondary" th:field="*{precio}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-white">Texto de Etiqueta</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary"
                            th:field="*{etiqueta}" id="inputEtiqueta" required oninput="actualizarBadgePreview()">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-white">Color de Etiqueta</label>
                        <select class="form-select bg-dark text-white border-secondary" th:field="*{colorEtiqueta}"
                            id="selectColorEtiqueta" onchange="actualizarBadgePreview()">
                            <option value="bg-danger">Rojo</option>
                            <option value="bg-warning text-dark">Amarillo</option>
                            <option value="bg-success">Verde</option>
                            <option value="bg-primary">Azul</option>
                            <option value="bg-info text-dark">Celeste</option>
                            <option value="bg-secondary">Gris</option>
                            <option value="bg-dark border border-warning text-warning">Negro &amp; Dorado</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3 d-flex align-items-center gap-2">
                    <small class="text-light text-opacity-75">Vista previa de la etiqueta:</small>
                    <span id="badgePreview" class="badge bg-primary px-3 py-1" th:text="*{etiqueta}">Popular</span>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-white">
                        <i class="bi bi-link-45deg me-1 text-warning"></i>URL de la Imagen del Plato
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-warning"><i
                                class="bi bi-image"></i></span>
                        <input type="text" class="form-control bg-dark text-white border-secondary"
                            th:field="*{imagenUrl}" id="inputImagen" placeholder="https://... o img/ceviche-mixto.jpg"
                            required oninput="actualizarPreview(this.value)">
                    </div>
                    <div class="form-text text-light text-opacity-50 small mt-1">
                        <i class="bi bi-info-circle me-1"></i>Pega cualquier enlace (URL) de internet o una ruta local.
                    </div>

                    <div class="mt-3 p-3 rounded-3 border border-secondary text-center"
                        style="background: rgba(0,0,0,0.25);">
                        <div class="small text-secondary mb-2 fw-semibold">Vista previa de la imagen:</div>
                        <img id="imgPreview" src="/img/ceviche-mixto.jpg" alt="Vista previa" class="rounded shadow-sm"
                            style="max-height: 140px; max-width: 100%; object-fit: cover; border: 1px solid rgba(255,255,255,0.15);"
                            onerror="this.src='/img/ceviche-mixto.jpg'">
                    </div>
                </div>

                <div
                    class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary border-opacity-50">
                    <a th:href="@{/}" class="btn btn-outline-light px-4 rounded-pill">
                        <i class="bi bi-arrow-left me-1"></i>Cancelar
                    </a>
                    <button type="submit" class="btn btn-warning text-dark px-5 rounded-pill fw-bold">
                        <i class="bi bi-check-lg me-1"></i>Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function actualizarPreview(url) {
            const preview = document.getElementById('imgPreview');
            if (!url || url.trim() === '') {
                preview.src = '/img/ceviche-mixto.jpg';
                return;
            }
            url = url.trim();
            if (url.startsWith('http://') || url.startsWith('https://')) {
                preview.src = url;
            } else {
                preview.src = '/' + url.replace(/^\//, '');
            }
        }

        function actualizarBadgePreview() {
            const badge = document.getElementById('badgePreview');
            const input = document.getElementById('inputEtiqueta');
            const select = document.getElementById('selectColorEtiqueta');
            if (badge && input && select) {
                badge.textContent = (input.value && input.value.trim() !== '') ? input.value : 'Etiqueta';
                badge.className = 'badge px-3 py-1 ' + select.value;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('inputImagen');
            if (input && input.value) {
                actualizarPreview(input.value);
            }
            actualizarBadgePreview();
        });
    </script>
</body>

</html>
